# Pipeline Config for Custom Use-Case

pipeline:
  corpus_name: "custom_corpus"                        # Combined corpus output name
  sources_path: "config/custom_usecase/sources.json"  # Test source/reference file
  models:
    default_model: "gemma3"                           # LLM model (determines tokenized data path)

# Step-specific configs
steps:
  step0_data_management:
    datasets:
      - "dataset_1"
      - "dataset_2"
      - "dataset_3"
      - "dataset_small"
      - "dataset-name"
  
  step0_dataset:
    #default_dataset: "dataset_small"                  # for remote downloads (URL-based Dataset)
    #local_file: "dataset1"                            # for local files (in data/ folder)
  
  step1_cleaning:
    #min_text_length: 60
    #min_alpha_ratio: 0.5
    #chunk_size: 5000
    #check_duplicates: true
    hf_config: null
    #hf_dataset: null
  
  step2_tokenization:
    dataset_cleaned: "custom_corpus"
    # "base_model" is auto-derived from default_model
    train_test_split: 0.1
    num_workers: 2
  
  step3_pretraining:
    tokenized_data: "custom_corpus_tokenized-gemma3"
