# Pipeline Config for Custom Use-Case

pipeline:
  corpus_name: "custom_corpus"                        # Combined corpus output name
  sources_path: "config/custom_usecase/sources.json"  # Test source/reference file
  models:
    default_model: "gemma3"                           # LLM model (determines tokenized data path)

# Step-specific configs
steps:
  step0_data_management:
    datasets:
      - "your_dataset_1"
      - "your_dataset_2"
  
  step0_dataset:
    #default_dataset: "your_dataset_1"
  
  step1_cleaning:
    #min_text_length: 60
    #min_alpha_ratio: 0.5
    #chunk_size: 5000
    #check_duplicates: true
    hf_config: null
    #hf_dataset: null
  
  step2_tokenization:
    dataset_cleaned: "custom_corpus"
    # "base_model" is auto-derived from default_model
    train_test_split: 0.1
    num_workers: 2
  
  step3_pretraining:
    tokenized_data: "custom_corpus_tokenized-gemma3"
    # "base_model" is auto-derived from tokenized_data
    batch_size: 32    # use 8 on CPU/low-VRAM
    #seed: 42
    #ncentroids: 2048
    #num_keys_to_add_at_a_time: 100000
  
  step4_training:
    #no_unsloth: false
    tokenized_data: "custom_corpus_tokenized-gemma3"
    # "base_model" is auto-derived from tokenized_data
    max_steps: 1000
    checkpointing_steps: 50
    #checkpoint: "step_100"
    #learning_rate: 1.5e-4
    #k_neighbors: 4
    #alpha: 0.5
    #lmbda: 0.3
    #seed: 42
    #per_device_train_batch_size: 1
    #gradient_accumulation_steps: 16
  
  step5_testing:
    checkpoint: null
    # "base_model" is auto-derived from checkpoint
    #base_model: "unsloth/gemma-3-1b-it"  # test with different base model of same family
    #lmbda: 0.3
    #knn_temp: 1.0
    max_new_tokens: 512
    repetition_penalty: 1.1
    #seed: 42
    scenarios:
      #- "example_scenario_1"
      #- "example_scenario_2"
    tasks:
      #- "question_answering"
      #- "completion"
      #- "summarization"
      #- "content_creation"
    #save_results: true
    #compare_base: true
  
  step5_evaluation:
    checkpoint: null
    tokenized_data: "custom_corpus_tokenized-gemma3"
    # "base_model" is auto-derived from tokenized_data/checkpoint
    #base_model: "unsloth/gemma-3-1b-it"  # test with different base model of same family
    #split: "test"
    max_examples: 100
    #lmbda: 0.3
    #knn_temp: 1.0
    batch_size: 4
    #seed: 42
    #save_results: true
    #compare_base: true